# nginx for the pilot (real data) on a Russian VPS. See docs/DEPLOYMENT.md.
#
# Install as /etc/nginx/sites-available/dorm-laundry, replace
# laundry.example.ru with the real domain (three places), link it into
# sites-enabled, then get the certificate with certbot (the paths below are
# the ones certbot creates).

# Plain HTTP only redirects to HTTPS (and answers Let's Encrypt).
server {
    listen 80;
    listen [::]:80;
    server_name laundry.example.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name laundry.example.ru;

    ssl_certificate     /etc/letsencrypt/live/laundry.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laundry.example.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Must equal MAX_UPLOAD_BYTES_HARD (20 MB by default): the app refuses
    # anything larger with the same limit, so residents get a clear message
    # instead of an nginx error page.
    client_max_body_size 20m;

    # Static files (CSS, JS, icons) straight from disk: collectstatic writes
    # them to staticfiles/ with hashed names, so they can be cached for long.
    location /static/ {
        alias /srv/dorm-laundry/app/staticfiles/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # Receipts and QR codes (PRIVATE_MEDIA_ROOT) are NEVER served by nginx:
    # only the app hands them out, after checking who is asking. There is
    # deliberately no location for /srv/dorm-laundry/private_media.

    location / {
        proxy_pass http://unix:/run/dorm-laundry/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The client's address for login limits (CLIENT_IP_HEADER in prod.py).
        # Set from the connection itself, replacing any copy the client sent.
        proxy_set_header X-Real-IP $remote_addr;
        # Django trusts this header (SECURE_PROXY_SSL_HEADER in prod.py).
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }
}
