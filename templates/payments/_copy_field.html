{% load i18n %}
{# One value with a copy button: label, value, id. #}
<div class="mb-3">
  <label for="{{ id }}" class="mb-1 block text-sm text-muted">{{ label }}</label>
  <div class="flex gap-2">
    <input id="{{ id }}" type="text" readonly value="{{ value }}" data-select-on-click
           class="min-w-0 flex-1 rounded border border-line-strong bg-subtle px-3 py-2">
    <button type="button" class="shrink-0 rounded border border-accent px-3 py-2 text-sm font-medium text-link hover:bg-accent-soft"
            data-copy-target="{{ id }}" data-copied="{% translate 'Copied' %}">{% translate "Copy" %}</button>
  </div>
</div>
