{% load i18n static %}<!doctype html>
{% get_current_language as LANGUAGE_CODE %}
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% translate "Dorm Laundry" %}{% endblock %}</title>
  {% if demo_mode %}<meta name="robots" content="noindex, nofollow">{% endif %}
  {# Everything is served from our own server: no CDNs, no inline scripts (CSP). #}
  {# htmx must not add its own <style> tag, which the CSP would block. #}
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static 'vendor/htmx/htmx.min.js' %}" defer></script>
  <script src="{% static 'js/app.js' %}" defer></script>
  {% block head %}{% endblock %}
</head>
{# htmx sends the CSRF token with every request it makes. #}
<body class="min-h-screen bg-slate-50 text-slate-900 font-sans" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  {% if demo_mode %}
    <div class="bg-amber-400 px-4 py-2 text-center text-sm font-medium text-amber-950" role="note">
      {% translate "Demo: all names and data here are made up. Do not enter real personal data." %}
    </div>
  {% endif %}
  <header class="flex items-center justify-between gap-4 bg-white px-4 py-3 shadow-sm">
    <a href="{% url 'core:home' %}" class="font-semibold">{% translate "Dorm Laundry" %}</a>
    <div class="flex items-center gap-3">
      {% include "core/_language_switch.html" %}
      {% if user.is_authenticated %}
        <form action="{% url 'accounts:logout' %}" method="post">
          {% csrf_token %}
          <button type="submit" class="text-sm text-slate-600 underline hover:text-slate-900">{% translate "Log out" %}</button>
        </form>
      {% endif %}
    </div>
  </header>
  {% if resident_balance is not None %}
    {# Resident navigation: a bottom bar on phones, a row under the header on wider screens. #}
    {% load money %}
    {% url 'core:home' as home_url %}{% url 'bookings:mine' as mine_url %}{% url 'ledger:balance' as balance_url %}
    <nav aria-label="{% translate 'Main' %}"
         class="fixed inset-x-0 bottom-0 z-10 grid grid-cols-3 border-t border-slate-200 bg-white text-center text-sm md:static md:mx-auto md:flex md:max-w-3xl md:gap-2 md:border-0 md:bg-transparent md:px-4 md:pt-3">
      <a href="{{ home_url }}" class="px-2 py-3 md:rounded md:py-2 {% if request.path == home_url %}font-semibold text-blue-700{% else %}text-slate-700{% endif %}">{% translate "Book" %}</a>
      <a href="{{ mine_url }}" class="px-2 py-3 md:rounded md:py-2 {% if request.path == mine_url %}font-semibold text-blue-700{% else %}text-slate-700{% endif %}">{% translate "My bookings" %}</a>
      <a href="{{ balance_url }}" class="px-2 py-3 md:ml-auto md:rounded md:py-2 {% if request.path == balance_url %}font-semibold text-blue-700{% else %}text-slate-700{% endif %}">{% translate "Balance" %}: {{ resident_balance|rub }}</a>
    </nav>
  {% elif is_admin_role %}
    {# Admin navigation: at most 5-6 items (docs/CLAUDE.md, Admin UI principles). #}
    {% url 'manage:residents' as residents_url %}{% url 'core:staff_home' as keys_url %}{% url 'manage:audit' as audit_url %}
    <nav aria-label="{% translate 'Main' %}"
         class="fixed inset-x-0 bottom-0 z-10 grid grid-cols-3 border-t border-slate-200 bg-white text-center text-sm md:static md:mx-auto md:flex md:max-w-3xl md:gap-2 md:border-0 md:bg-transparent md:px-4 md:pt-3">
      <a href="{{ residents_url }}" class="px-2 py-3 md:rounded md:py-2 {% if residents_url in request.path %}font-semibold text-blue-700{% else %}text-slate-700{% endif %}">{% translate "Residents" %}</a>
      <a href="{{ keys_url }}" class="px-2 py-3 md:rounded md:py-2 {% if request.path == keys_url %}font-semibold text-blue-700{% else %}text-slate-700{% endif %}">{% translate "Keys" %}</a>
      <a href="{{ audit_url }}" class="px-2 py-3 md:rounded md:py-2 {% if request.path == audit_url %}font-semibold text-blue-700{% else %}text-slate-700{% endif %}">{% translate "Change history" %}</a>
    </nav>
  {% endif %}
  <main class="mx-auto max-w-3xl p-4 {% if resident_balance is not None or is_admin_role %}pb-20 md:pb-4{% endif %}">
    {% for message in messages %}
      <div class="mb-4 rounded border p-3 {% if message.level_tag == 'error' %}border-red-300 bg-red-50 text-red-800{% else %}border-green-300 bg-green-50 text-green-800{% endif %}" role="status">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
