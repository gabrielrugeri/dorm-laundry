{% load i18n %}
<div class="flex items-center justify-between gap-3 px-4 py-3">
  <a href="{% url 'bookings:detail' group_id=group.group_id %}" class="min-w-0">
    <span class="block font-medium">{{ group.day|date:"D j M" }}, {{ group.starts_at|time:"H:i" }}–{{ group.ends_at|time:"H:i" }}</span>
    <span class="block text-sm text-slate-600">{{ group.machine.label }}{% if group.is_cancelled %} · {% translate "Cancelled" %}{% endif %}</span>
  </a>
  {% if show_cancel %}
    <a href="{% url 'bookings:cancel' group_id=group.group_id %}" class="shrink-0 text-sm text-red-700 underline">{% translate "Cancel" %}</a>
  {% endif %}
</div>
