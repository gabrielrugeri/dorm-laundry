# Tool configuration only; dependencies live in requirements*.in / *.txt.

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
testpaths = ["apps", "tests"]
addopts = "--reuse-db --strict-markers"
markers = [
    "postgres: needs PostgreSQL (real concurrent transactions); skipped on SQLite",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
# Line length is handled by `ruff format`; long strings (hashes, URLs) are fine.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
